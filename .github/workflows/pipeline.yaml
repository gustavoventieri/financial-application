name: Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  ci:
    name: Continuous Integration
    uses: ./.github/workflows/ci.yaml

  codeql:
    name: CodeQL Analysis
    needs: ci
    uses: ./.github/workflows/codeql.yaml

  container:
    name: Container Security
    needs:
      - ci
      - codeql
    uses: ./.github/workflows/container-security.yaml

  deploy:
    name: Deploy
    needs:
      - ci
      - security
      - codeql
      - container
    uses: ./.github/workflows/deploy.yaml