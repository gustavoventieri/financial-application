spring:
  config:
    import: "optional:file:.env.properties"

  application:
    name: ${APP_NAME}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    hibernate:
      ddl-auto: update

    show-sql: true
    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

springdoc:
  scalar:
    enabled: true
    theme: dark


server:
  port: ${APP_PORT}
  servlet:
    context-path: /api/v1
  forward-headers-strategy: native

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    expiration: ${JWT_EXPIRATION_TIME}
  security:
    bcrypt:
      strength: ${BCRYPT_FACTOR}